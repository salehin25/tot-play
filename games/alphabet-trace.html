<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#19547b">
<title>Letter Tracer</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/favicon.png">
<link rel="apple-touch-icon" href="../icons/favicon.png">
<link rel="stylesheet" href="../css/shared.css">
<style>
body { margin:0; overflow:hidden; background:#eaf4fb; touch-action:none; font-family:'Kalam', 'Segoe Print', cursive, sans-serif; }
.topbar { z-index:20; }
#instruction { position:fixed; top:10px; left:50%; transform:translateX(-50%); color:#19547b; font-weight:bold; font-size:20px; z-index:30; }
#game-container { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:92vw; height:78vh; max-width:520px; max-height:640px; background:#fff; border-radius:28px; box-shadow:0 12px 40px rgba(32,156,231,0.18), 0 3px 10px rgba(0,0,0,0.06); border:3px solid #d6e7f5; overflow:hidden; z-index:10; }
canvas { position:absolute; top:0; left:0; border-radius:28px; touch-action:none; }
#bgCanvas { z-index:1; }
#paintCanvas { z-index:2; }
#animCanvas { z-index:3; pointer-events:none; }
#letterInfo { position:fixed; top:8px; left:50%; transform:translateX(-50%); background:rgba(255,255,255,0.9); padding:6px 18px; border-radius:999px; font-weight:800; font-size:22px; color:#19547b; z-index:40; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
.progress-bar { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); width:80%; max-width:400px; height:8px; background:rgba(255,255,255,0.4); border-radius:4px; overflow:hidden; z-index:30; }
.progress-fill { height:100%; background:linear-gradient(90deg,#209ce7,#17b978); border-radius:4px; width:0%; transition:width 0.3s ease; }
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<div class="topbar">
  <a class="home-btn" href="../index.html">🏠</a>
  <div class="title">✏️ Letter Tracer</div>
  <div style="display:flex;gap:10px;">
    <button class="icon-btn" id="soundBtn">🔊</button>
    <button class="icon-btn" id="fsBtn">⛶</button>
  </div>
</div>
<div id="letterInfo">A</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div id="instruction">Trace the letter — follow the glowing dot!</div>

<div id="game-container">
  <canvas id="bgCanvas"></canvas>
  <canvas id="paintCanvas"></canvas>
  <canvas id="animCanvas"></canvas>
</div>

<script src="../js/common.js"></script>
<script src="../js/sound-toggle.js"></script>
<script src="../js/page-init.js"></script>
<script>
/* ============================================================
   Letter Tracer — rebuilt using letters.html technique
   - bgCanvas: letter outline drawn with canvas text (Arial)
   - paintCanvas: user tracing with thick stroke
   - animCanvas: glowing dot guide following stroke path
   - Pixel-based mask not needed; we trace freely within letter
============================================================ */

const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const WORDS = { A:"Apple", B:"Ball", C:"Cat", D:"Dog", E:"Elephant", F:"Fish", G:"Giraffe", H:"Hat", I:"Ice cream", J:"Jelly", K:"Kite", L:"Lion", M:"Moon", N:"Nest", O:"Octopus", P:"Penguin", Q:"Queen", R:"Rabbit", S:"Sun", T:"Turtle", U:"Umbrella", V:"Violin", W:"Whale", X:"Xylophone", Y:"Yacht", Z:"Zebra" };

const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
const paintCanvas = document.getElementById('paintCanvas');
const paintCtx = paintCanvas.getContext('2d');
const animCanvas = document.getElementById('animCanvas');
const animCtx = animCanvas.getContext('2d');

let currentLetter = 'A';
let strokeIndex = 0; // which stroke we're tracing
let isDrawing = false;
let animProgress = 0;
let animId = null;

// Multi-stroke paths in 400x400 space (match letters.html style); scaled to canvas
const letterStrokes = {
  A: [
    [{x:200,y:70},{x:100,y:320}],                       // left leg
    [{x:200,y:70},{x:300,y:320}],                       // right leg
    [{x:130,y:220},{x:270,y:220}]                       // crossbar
  ],
  B: [
    [{x:100,y:70},{x:100,y:320}],                       // stem
    [{x:100,y:70},{x:240,y:70},{x:240,y:190},{x:100,y:190}], // top loop
    [{x:100,y:190},{x:260,y:190},{x:260,y:320},{x:100,y:320}] // bottom loop
  ],
  C: [
    [{x:300,y:100},{x:180,y:70},{x:100,y:180},{x:100,y:240},{x:180,y:330},{x:300,y:300}]
  ],
  D: [
    [{x:100,y:70},{x:100,y:320}],                       // stem
    [{x:100,y:70},{x:280,y:70},{x:300,y:200},{x:280,y:320},{x:100,y:320}]
  ],
};

function resizeCanvases() {
  const rect = document.getElementById('game-container').getBoundingClientRect();
  const w = Math.round(rect.width);
  const h = Math.round(rect.height);
  [bgCanvas, paintCanvas, animCanvas].forEach(c => { c.width = w; c.height = h; });
  bgCtx.save(); bgCtx.font = 'bold 260px Arial, sans-serif'; bgCtx.textAlign = 'center'; bgCtx.textBaseline = 'middle'; bgCtx.lineWidth = 10; bgCtx.lineJoin = 'round'; bgCtx.lineCap = 'round';
  setupLetter();
}
window.addEventListener('resize', resizeCanvases);

function setupLetter() {
  const w = bgCanvas.width, h = bgCanvas.height;
  bgCtx.clearRect(0,0,w,h);
  bgCtx.save();
  bgCtx.lineJoin = 'round'; bgCtx.lineCap = 'round';
  // Draw faint outline using exact stroke points (so guide and outline match)
  bgCtx.lineWidth = 10;
  bgCtx.strokeStyle = '#b0d4f1';
  const strokes = letterStrokes[currentLetter] || letterStrokes['A'];
  const sx = w / 400, sy = h / 400;
  strokes.forEach(stroke => {
    bgCtx.beginPath();
    bgCtx.moveTo(stroke[0].x * sx, stroke[0].y * sy);
    for (let i = 1; i < stroke.length; i++) bgCtx.lineTo(stroke[i].x * sx, stroke[i].y * sy);
    bgCtx.stroke();
  });
  // Large faint text letter for recognition behind the outline
  bgCtx.font = 'bold 260px Arial, sans-serif'; bgCtx.textAlign = 'center'; bgCtx.textBaseline = 'middle';
  bgCtx.fillStyle = '#e8f0fa'; bgCtx.fillText(currentLetter, w/2, h/2 + 20);
  bgCtx.restore();
  strokeIndex = 0; animProgress = 0;
  startGuideAnimation();
}

function getCurrentStroke(letter, idx) {
  const strokes = letterStrokes[letter] || letterStrokes['A'];
  if (idx >= strokes.length) return strokes[strokes.length - 1];
  return strokes[idx];
}

function getLetterPath(letter, idx) {
  // Return points for current stroke only, scaled to canvas
  const sx = bgCanvas.width / 400, sy = bgCanvas.height / 400;
  const pts = getCurrentStroke(letter, idx === undefined ? 0 : idx).map(p => ({ x: p.x * sx, y: p.y * sy }));
  return pts;
}

function startGuideAnimation() {
  cancelAnimationFrame(animId);
  animProgress = 0;
  const pts = getLetterPath(currentLetter, strokeIndex);
  function animate() {
    animCtx.clearRect(0,0,animCanvas.width,animCanvas.height);
    animProgress += 0.004;
    if (animProgress > 1) animProgress = 0;
    let pt = interpolatePoint(pts, animProgress);
    animCtx.beginPath();
    animCtx.arc(pt.x, pt.y, 22, 0, Math.PI*2);
    animCtx.fillStyle = 'rgba(255,107,107,0.75)';
    animCtx.fill();
    animCtx.strokeStyle = '#fff';
    animCtx.lineWidth = 3;
    animCtx.stroke();
    animId = requestAnimationFrame(animate);
  }
  animate();
}

function interpolatePoint(pts, t) {
  // pts: array of {x,y} objects from getLetterPath
  const idx = Math.min(Math.floor(t * (pts.length - 1)), pts.length - 2);
  const localT = (t * (pts.length - 1)) - idx;
  return {
    x: pts[idx].x + (pts[idx + 1].x - pts[idx].x) * localT,
    y: pts[idx].y + (pts[idx + 1].y - pts[idx].y) * localT
  };
}

function getCanvasPos(e) {
  const rect = paintCanvas.getBoundingClientRect();
  const cx = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX) || 0;
  const cy = e.clientY || (e.touches && e.touches[0] && e.touches[0].clientY) || 0;
  return { x: cx - rect.left, y: cy - rect.top };
}

paintCanvas.addEventListener('pointerdown', (e) => {
  isDrawing = true;
  paintCtx.beginPath();
  paintCtx.lineWidth = 36;
  paintCtx.lineCap = 'round';
  paintCtx.lineJoin = 'round';
  paintCtx.strokeStyle = '#ffbb00';
  const p = getCanvasPos(e);
  paintCtx.moveTo(p.x, p.y);
});

paintCanvas.addEventListener('pointermove', (e) => {
  if (!isDrawing) return;
  e.preventDefault();
  const p = getCanvasPos(e);
  paintCtx.lineTo(p.x, p.y);
  paintCtx.stroke();
});

window.addEventListener('pointerup', () => {
  if (!isDrawing) return;
  isDrawing = false;
  // Advance to next stroke only after user lifts; one at a time
  strokeIndex++;
  const strokes = letterStrokes[currentLetter] || letterStrokes['A'];
  if (strokeIndex >= strokes.length) {
    cancelAnimationFrame(animId);
    animCtx.clearRect(0,0,animCanvas.width,animCanvas.height);
    setTimeout(() => {
      // Next letter / reset for demo — clear paint and restart
      changeLetter(currentLetter);
    }, 600);
  } else {
    // Clear only the guide for next stroke; keep drawn paint visible
    startGuideAnimation();
  }
});

function changeLetter(letter) {
  currentLetter = letter;
  document.getElementById('letterInfo').textContent = letter;
  document.getElementById('instruction').textContent = 'Trace the letter — follow the glowing dot!';
  paintCtx.clearRect(0,0,paintCanvas.width,paintCanvas.height);
  setupLetter();
  strokeIndex = 0; // reset to first stroke
}

// Init
resizeCanvases();
changeLetter('A');
</script>
</body>
</html>
