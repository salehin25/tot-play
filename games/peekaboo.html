<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#a1c4fd">
    <title>Peek-a-Boo</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../icons/favicon.png">
    <link rel="apple-touch-icon" href="../icons/favicon.png">
    <link rel="stylesheet" href="../css/shared.css">
    <style>
        .topbar { z-index: 20; }
        main.stage { padding: clamp(16px, 3vh, 30px); gap: clamp(16px, 3vh, 24px); }
        .doors-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(12px, 2.5vw, 20px); width: 100%; max-width: 720px; margin: 0 auto; }
        .door-container { perspective: 1000px; }
        .door { position: relative; width: 100%; aspect-ratio: 3/4; border-radius: 16px; background: linear-gradient(160deg, #8b5a2b, #5d3a1a); box-shadow: 0 8px 0 rgba(36,49,94,0.2), inset 0 -4px 0 rgba(0,0,0,0.2); cursor: pointer; touch-action: none; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4,0,0.2,1); border: 4px solid #3d2614; }
        .door.open { transform: rotateY(-160deg); pointer-events: none; }
        .door.knocking { animation: knock 0.3s ease; }
        @keyframes knock { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
        .door-face { position: absolute; inset: 0; border-radius: 12px; background: linear-gradient(160deg, #a0522d, #6b3a1a); display: flex; align-items: center; justify-content: center; backface-visibility: hidden; }
        .door-face.back { transform: rotateY(180deg); background: linear-gradient(160deg, #f5e6cc, #e8d5b7); }
        .door-knob { position: absolute; top: 50%; right: 12px; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(160deg, #ffd700, #b8860b); border: 2px solid #8b6914; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.2); }
        .door-content { width: 80%; height: 80%; border-radius: 12px; object-fit: cover; background: #fff; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
        .door-placeholder { width: 80%; height: 80%; border-radius: 12px; background: repeating-linear-gradient(45deg, #f0e0d0, #f0e0d0 10px, #e8d5b7 10px, #e8d5b7 20px); display: flex; align-items: center; justify-content: center; font-size: clamp(2rem, 6vh, 3.5rem); }
        .custom-photo-input { display: none; }
        .add-photo-btn { position: fixed; bottom: max(20px, env(safe-area-inset-bottom) + 20px); left: 50%; transform: translateX(-50%); width: clamp(56px, 10vh, 70px); height: clamp(56px, 10vh, 70px); border: none; border-radius: 50%; background: linear-gradient(160deg, #4d96ff, #209ce7); color: #fff; font-size: clamp(24px, 4vh, 32px); box-shadow: 0 8px 0 rgba(32,156,231,0.4); cursor: pointer; z-index: 20; transition: transform 0.1s; }
        .add-photo-btn:active { transform: translateX(-50%) scale(0.95); }
        .hint { text-align: center; font-size: clamp(1rem, 2.5vh, 1.2rem); color: rgba(255,255,255,0.9); text-shadow: 0 2px 0 rgba(36,49,94,0.25); margin-bottom: 8px; }
    </style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<div class="topbar">
    <a class="home-btn" href="../index.html">🏠</a>
    <div class="title">🚪 Peek-a-Boo</div>
    <div style="display:flex;gap:10px;">
        <button class="icon-btn" id="soundBtn">🔊</button>
        <button class="icon-btn" id="fsBtn" aria-label="Fullscreen">⛶</button>
    </div>
</div>
<main class="stage">
    <p class="hint">Tap a door to knock!</p>
    <div class="doors-grid" id="doorsGrid"></div>
</main>
<button class="add-photo-btn" id="addPhotoBtn" title="Add family photo">📷</button>
<input type="file" class="custom-photo-input" id="photoInput" accept="image/*" multiple>
<script src="../js/common.js"></script>
<script src="../js/sound-toggle.js"></script>
<script src="../js/page-init.js"></script>
<script>
const DOOR_DEFAULTS = [
    { name: "Lion", emoji: "🦁", sound: "roar", emojiFallback: "🦁" },
    { name: "Dog", emoji: "🐶", sound: "bark", emojiFallback: "🐶" },
    { name: "Cat", emoji: "🐱", sound: "meow", emojiFallback: "🐱" },
    { name: "Elephant", emoji: "🐘", sound: "trumpet", emojiFallback: "🐘" },
    { name: "Bird", emoji: "🐦", sound: "chirp", emojiFallback: "🐦" },
    { name: "Frog", emoji: "🐸", sound: "ribbit", emojiFallback: "🐸" }
];

let doors = [];
let customPhotos = [];

function loadPhotos() {
    const stored = localStorage.getItem("peekaboo_photos");
    if (stored) {
        try { customPhotos = JSON.parse(stored); } catch { customPhotos = []; }
    }
}

function savePhotos() {
    localStorage.setItem("peekaboo_photos", JSON.stringify(customPhotos));
}

function createDoor(item, index) {
    const container = document.createElement("div");
    container.className = "door-container";

    const door = document.createElement("div");
    door.className = "door";
    door.dataset.index = index;

    const front = document.createElement("div");
    front.className = "door-face front";
    front.innerHTML = `<div class="door-knob"></div><div class="door-placeholder">${item.emoji}</div>`;

    const back = document.createElement("div");
    back.className = "door-face back";
    let contentHtml = "";
    if (item.photo) {
        contentHtml = `<img class="door-content" src="${item.photo}" alt="${item.name}">`;
    } else {
        contentHtml = `<div class="door-placeholder">${item.emojiFallback}</div>`;
    }
    back.innerHTML = contentHtml;

    door.appendChild(front);
    door.appendChild(back);
    container.appendChild(door);

    door.addEventListener("pointerdown", () => knockDoor(door, item));
    return container;
}

function knockDoor(door, item) {
    if (door.classList.contains("open")) return;
    door.classList.add("knocking");
    TotAudio.tap();
    speak("Knock knock!");

    setTimeout(() => {
        door.classList.remove("knocking");
        door.classList.add("open");
        playSound(item.sound);
        speak(item.name + " says hello!");
        confetti(1000);
        setTimeout(() => {
            door.classList.remove("open");
        }, 3000);
    }, 400);
}

function playSound(type) {
    if (TotAudio.isMuted()) return;
    const ctx = TotAudio.unlock();
    if (!ctx) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g).connect(ctx.destination);

    if (type === "roar") {
        o.type = "sawtooth"; o.frequency.setValueAtTime(80, ctx.currentTime);
        g.gain.setValueAtTime(0.3, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1);
        o.start(); o.stop(ctx.currentTime + 1);
    } else if (type === "bark") {
        o.type = "square"; o.frequency.setValueAtTime(300, ctx.currentTime);
        g.gain.setValueAtTime(0.2, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        o.start(); o.stop(ctx.currentTime + 0.3);
        setTimeout(() => { const o2 = ctx.createOscillator(); const g2 = ctx.createGain(); o2.type="square"; o2.frequency.value=250; o2.connect(g2).connect(ctx.destination); g2.gain.value=0.2; g2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.3); o2.start(); o2.stop(ctx.currentTime+0.3); }, 150);
    } else if (type === "meow") {
        o.type = "sine"; o.frequency.setValueAtTime(400, ctx.currentTime);
        g.gain.setValueAtTime(0.2, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.5);
        o.frequency.exponentialRampToValueAtTime(600, ctx.currentTime+0.3);
        o.start(); o.stop(ctx.currentTime+0.5);
    } else if (type === "trumpet") {
        o.type = "triangle"; o.frequency.setValueAtTime(200, ctx.currentTime);
        g.gain.setValueAtTime(0.25, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.8);
        o.frequency.exponentialRampToValueAtTime(400, ctx.currentTime+0.4);
        o.start(); o.stop(ctx.currentTime+0.8);
    } else if (type === "chirp") {
        o.type = "sine"; o.frequency.setValueAtTime(1200, ctx.currentTime);
        g.gain.setValueAtTime(0.15, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.2);
        o.frequency.exponentialRampToValueAtTime(1800, ctx.currentTime+0.1);
        o.start(); o.stop(ctx.currentTime+0.2);
        setTimeout(() => { const o2=ctx.createOscillator(); const g2=ctx.createGain(); o2.type="sine"; o2.frequency.value=1500; o2.connect(g2).connect(ctx.destination); g2.gain.value=0.15; g2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.2); o2.start(); o2.stop(ctx.currentTime+0.2); }, 250);
    } else if (type === "ribbit") {
        o.type = "square"; o.frequency.setValueAtTime(150, ctx.currentTime);
        g.gain.setValueAtTime(0.2, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.3);
        o.start(); o.stop(ctx.currentTime+0.3);
        setTimeout(() => { const o2=ctx.createOscillator(); const g2=ctx.createGgain(); o2.type="square"; o2.frequency.value=120; o2.connect(g2).connect(ctx.destination); g2.gain.value=0.2; g2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.3); o2.start(); o2.stop(ctx.currentTime+0.3); }, 200);
    }
}

function speak(text) {
    if (!TotAudio.isMuted() && "speechSynthesis" in window) {
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9; u.pitch = 1.1;
        speechSynthesis.cancel(); speechSynthesis.speak(u);
    }
}

function initDoors() {
    const grid = document.getElementById("doorsGrid");
    grid.innerHTML = "";
    DOOR_DEFAULTS.forEach((item, i) => {
        const saved = customPhotos[i];
        const doorItem = { ...item, photo: saved };
        grid.appendChild(createDoor(doorItem, i));
    });
}

document.getElementById("addPhotoBtn").addEventListener("click", () => {
    document.getElementById("photoInput").click();
});

document.getElementById("photoInput").addEventListener("change", (e) => {
    const files = Array.from(e.target.files);
    files.forEach((file, i) => {
        if (file.type.startsWith("image/")) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const idx = customPhotos.length % 6;
                customPhotos[idx] = ev.target.result;
                savePhotos();
                initDoors();
            };
            reader.readAsDataURL(file);
        }
    });
    e.target.value = "";
});

loadPhotos();
initDoors();
</script>
</body>
</html>
