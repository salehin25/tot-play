<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#a18cd1">
    <title>Coloring Fun</title>
    <link rel="stylesheet" href="../css/shared.css">
    <style>
        main.stage {
            flex-direction: row;
            align-items: stretch;
            padding-bottom: calc(max(14px, env(safe-area-inset-bottom)) + 8px);
        }

        .pic-name {
            position: absolute;
            top: calc(max(10px, env(safe-area-inset-top)) + clamp(52px, 9vh, 80px));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 18px;
            border-radius: 999px;
            font-weight: 800;
            font-size: clamp(0.85rem, 2.2vh, 1.15rem);
            z-index: 10;
            color: var(--ink);
        }

        .canvas-wrap {
            flex: 1;
            min-height: 0;
            min-width: 0;
            display: grid;
            place-items: center;
            position: relative;
        }

        #paint {
            max-width: 98%;
            max-height: 100%;
            aspect-ratio: 900 / 640;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 14px 0 rgba(36, 49, 94, 0.16), 0 20px 40px rgba(36, 49, 94, 0.18);
            touch-action: none;
        }

        .side {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 1.8vh, 18px);
            padding: clamp(10px, 1.8vh, 18px) clamp(10px, 1vw, 16px);
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.55);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            box-shadow: var(--shadow);
        }

        .palette {
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1vh, 10px);
        }

        .swatch {
            width: clamp(38px, 6vh, 54px);
            height: clamp(38px, 6vh, 54px);
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 4px 0 rgba(36, 49, 94, 0.16);
            cursor: pointer;
            outline: 4px solid transparent;
            transition: transform 0.12s, outline-color 0.1s;
            flex: 0 0 auto;
        }

        .swatch.selected {
            transform: scale(1.15);
            outline-color: var(--ink);
        }

        .tools {
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1vh, 10px);
        }

        .tool, .nav-btn {
            width: clamp(44px, 7vh, 62px);
            height: clamp(44px, 7vh, 62px);
            border: none;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 5px 0 rgba(36, 49, 94, 0.16);
            font-size: clamp(19px, 3vh, 27px);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: transform 0.1s;
            flex: 0 0 auto;
        }

        .tool.active {
            background: linear-gradient(160deg, #ffd166, #ff9f1c);
            outline: 4px solid #fff;
        }

        .sizes {
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1vh, 10px);
        }

        .size-dot {
            display: block;
            border-radius: 50%;
            background: var(--ink);
        }

        #toolRainbow.active {
            background: linear-gradient(135deg, #ff6b6b, #ffc93c, #17b978, #4d96ff, #9b5de5);
            outline: 4px solid #fff;
        }

        .nav {
            display: flex;
            gap: clamp(6px, 1vh, 10px);
        }

        @media (orientation: portrait) {
            main.stage { flex-direction: column; }
            .side { flex-direction: row; width: 100%; justify-content: center; }
            .palette { flex-direction: row; }
            .tools { flex-direction: row; }
            .sizes { flex-direction: row; }
            #paint { max-height: 100%; max-width: 100%; }
        }
    </style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>

<div class="topbar">
    <a class="home-btn" href="../index.html">🏠</a>
    <div class="title">🎨 Coloring Fun</div>
    <div style="display:flex;gap:10px;">
        <button class="icon-btn" id="soundBtn">🔊</button>
        <button class="icon-btn" id="fsBtn" aria-label="Fullscreen">⛶</button>
    </div>
</div>

<span class="pic-name" id="picName">Fish</span>

<main class="stage">
    <div class="canvas-wrap">
        <canvas id="paint" aria-label="coloring canvas"></canvas>
    </div>
    <aside class="side">
        <div class="palette" id="palette"></div>
        <div class="tools">
            <button class="tool active" id="toolFill">🪣</button>
            <button class="tool" id="toolBrush">🖌️</button>
            <div class="sizes" id="sizes"></div>
            <button class="tool" id="toolRainbow">🌈</button>
            <button class="tool" id="undoBtn">↩️</button>
            <button class="tool" id="clearBtn">🧽</button>
        </div>
        <div class="nav">
            <button class="nav-btn" id="prevBtn">⬅️</button>
            <button class="nav-btn" id="nextBtn">➡️</button>
        </div>
    </aside>
</main>

<script src="../js/common.js"></script>
<script src="../js/coloring-data.js"></script>
<script src="../js/coloring.js"></script>
<script src="../js/sound-toggle.js"></script>
<script src="../js/page-init.js"></script>
</body>
</html>
