<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>body{font-family:system-ui;background:#222;color:#eee;padding:20px}</style></head>
<body>
<h2>Handwriting Reference Generator</h2>
<p>Render letters with handwriting-style fonts, then visually trace.</p>
<div id="letters"></div>
<script>
const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const container = document.getElementById('letters');
for (const l of letters) {
    const div = document.createElement('div');
    div.innerHTML = `<h3>${l}</h3><div style="font-family:'Segoe Print','Brush Script MT','Comic Sans MS',cursive;font-size:120px;color:#fff;line-height:1.2">${l}</div>`;
    container.appendChild(div);
}
</script>
</body>
</html>
