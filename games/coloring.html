<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#a18cd1">
    <title>Coloring Fun</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../icons/favicon.png">
    <link rel="apple-touch-icon" href="../icons/icon-192.png">
    <link rel="stylesheet" href="../css/shared.css">
    <style>
        main.stage {
            flex-direction: row;
            align-items: stretch;
            padding: clamp(10px, 1.5vh, 20px);
            gap: clamp(12px, 2vw, 20px);
        }

        .pic-name {
            position: absolute;
            top: calc(max(10px, env(safe-area-inset-top)) + clamp(48px, 8vh, 70px));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 18px;
            border-radius: 999px;
            font-weight: 800;
            font-size: clamp(0.8rem, 2vh, 1.1rem);
            z-index: 10;
            color: var(--ink);
        }

        .canvas-wrap {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: grid;
            place-items: center;
        }

        #paint {
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 900 / 640;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 14px 0 rgba(36, 49, 94, 0.16), 0 20px 40px rgba(36, 49, 94, 0.18);
            touch-action: none;
        }

        .side-panel {
            width: clamp(160px, 20vw, 220px);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: clamp(10px, 1.5vh, 16px);
        }

        .panel {
            flex: 1;
            min-height: 0;
            background: rgba(255, 255, 255, 0.6);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: clamp(10px, 1.5vh, 16px);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .panel-title {
            font-size: clamp(0.7rem, 1.8vh, 0.9rem);
            font-weight: 800;
            color: var(--ink);
            opacity: 0.7;
            margin-bottom: clamp(6px, 1vh, 10px);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .palette {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(6px, 1vh, 10px);
            justify-content: center;
        }

        .swatch {
            width: clamp(34px, 5.5vh, 48px);
            height: clamp(34px, 5.5vh, 48px);
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 4px 0 rgba(36, 49, 94, 0.16);
            cursor: pointer;
            outline: 4px solid transparent;
            transition: transform 0.12s, outline-color 0.1s;
        }

        .swatch.selected {
            transform: scale(1.2);
            outline-color: var(--ink);
        }

        .sizes {
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1vh, 10px);
        }

        .size-btn {
            width: clamp(48px, 8vh, 64px);
            height: clamp(48px, 8vh, 64px);
            border: none;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 4px 0 rgba(36, 49, 94, 0.14);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .size-btn:active { transform: translateY(3px); }

        .size-dot {
            display: block;
            border-radius: 50%;
            background: var(--ink);
        }

        .size-label {
            font-size: clamp(0.55rem, 1.4vh, 0.75rem);
            font-weight: 800;
            color: var(--ink);
            opacity: 0.7;
        }

        .size-btn.active {
            background: linear-gradient(160deg, #ffd166, #ff9f1c);
            outline: 4px solid #fff;
        }

        .sizes-row {
            display: flex;
            align-items: center;
            gap: clamp(6px, 1vh, 10px);
            justify-content: center;
            margin-top: clamp(6px, 1vh, 10px);
            flex-wrap: wrap;
        }

        .sizes-label {
            font-size: clamp(0.6rem, 1.5vh, 0.8rem);
            font-weight: 800;
            color: var(--ink);
            opacity: 0.7;
        }

        .sizes-row .sizes {
            display: flex;
            flex-direction: row;
            gap: clamp(6px, 1vh, 10px);
        }

        .tools {
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1vh, 10px);
        }

        .tool-row {
            display: flex;
            gap: clamp(6px, 1vh, 10px);
            flex-wrap: wrap;
            justify-content: center;
        }

        .tool {
            width: clamp(44px, 7.5vh, 60px);
            height: clamp(44px, 7.5vh, 60px);
            border: none;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 4px 0 rgba(36, 49, 94, 0.14);
            font-size: clamp(18px, 3vh, 26px);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .tool:active { transform: translateY(3px); }

        .tool.active {
            background: linear-gradient(160deg, #ffd166, #ff9f1c);
            outline: 4px solid #fff;
        }

        #toolRainbow.active {
            background: linear-gradient(135deg, #ff6b6b, #ffc93c, #17b978, #4d96ff, #9b5de5);
            outline: 4px solid #fff;
        }

        .rainbow-row {
            display: flex;
            justify-content: center;
            margin-top: clamp(6px, 1vh, 10px);
        }

        .tool-row {
            display: flex;
            gap: clamp(6px, 1vh, 10px);
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-row {
            display: flex;
            gap: clamp(6px, 1vh, 10px);
            margin-top: clamp(6px, 1vh, 10px);
        }

        .nav-btn {
            flex: 1;
            max-width: 72px;
            height: clamp(42px, 6.5vh, 56px);
            border: none;
            border-radius: 14px;
            background: linear-gradient(160deg, #a18cd1, #8ec5fc);
            color: #fff;
            font-size: clamp(16px, 2.8vh, 22px);
            font-weight: 800;
            box-shadow: 0 4px 0 rgba(161, 140, 209, 0.3);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .nav-btn:active { transform: translateY(3px); }

        @media (orientation: portrait) {
            main.stage { flex-direction: column; }
            .side-panel { width: 100%; flex-direction: row; flex-wrap: wrap; }
            .panel { width: 100%; }
            .sizes-row .sizes { flex-direction: row; }
            #paint { max-height: 100%; max-width: 100%; }
        }
    </style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>

<div class="topbar">
    <a class="home-btn" href="../index.html">🏠</a>
    <div class="title">🎨 Coloring Fun</div>
    <div style="display:flex;gap:10px;">
        <button class="icon-btn" id="soundBtn">🔊</button>
        <button class="icon-btn" id="fsBtn" aria-label="Fullscreen">⛶</button>
    </div>
</div>

<span class="pic-name" id="picName">Dog</span>

<main class="stage">
    <!-- LEFT PANEL: Tools -->
    <aside class="side-panel">
        <div class="panel">
            <div class="panel-title">Tools</div>
            <div class="tools">
                <div class="tool-row">
                    <button class="tool active" id="toolBrush" title="Brush">🖌️</button>
                    <button class="tool" id="toolFill" title="Fill (bucket)">🪣</button>
                    <button class="tool" id="undoBtn" title="Undo">↩️</button>
                    <button class="tool" id="clearBtn" title="Clear coloring">🧽</button>
                    <button class="tool" id="resetBtn" title="Reset to blank">✨</button>
                </div>
                <div class="sizes-row">
                    <span class="sizes-label">Size</span>
                    <div class="sizes" id="sizes"></div>
                </div>
                <div class="nav-row">
                    <button class="nav-btn" id="prevBtn" title="Previous picture">⬅️</button>
                    <button class="nav-btn" id="nextBtn" title="Next picture">➡️</button>
                </div>
            </div>
        </div>
    </aside>

    <div class="canvas-wrap">
        <canvas id="paint" aria-label="coloring canvas"></canvas>
    </div>

    <!-- RIGHT PANEL: Colors -->
    <aside class="side-panel">
        <div class="panel">
            <div class="panel-title">Color</div>
            <div class="palette" id="palette"></div>
            <div class="rainbow-row">
                <button class="tool" id="toolRainbow" title="Rainbow mode">🌈</button>
            </div>
        </div>
    </aside>
</main>

<script src="../js/common.js"></script>
<script src="../js/coloring-data.js"></script>
<script src="../js/coloring.js"></script>
<script src="../js/sound-toggle.js"></script>
<script src="../js/page-init.js"></script>
</body>
</html>
