<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ee9ca7">
    <title>Pop & Count</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../icons/favicon.png">
    <link rel="apple-touch-icon" href="../icons/favicon.png">
    <link rel="stylesheet" href="../css/shared.css">
    <style>
        .topbar { z-index: 20; }
        main.stage { position: relative; padding: 0; }
        canvas#popCanvas { display: block; width: 100%; height: 100%; touch-action: none; }
        .counter { position: fixed; top: max(60px, env(safe-area-inset-top) + 60px); left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.95); padding: 8px 28px; border-radius: 999px; font-weight: 800; font-size: clamp(1.5rem, 5vh, 2.5rem); color: var(--ink); z-index: 10; box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; }
        .counter .label { font-size: clamp(0.9rem, 3vh, 1.3rem); opacity: 0.7; }
    </style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<div class="topbar">
    <a class="home-btn" href="../index.html">🏠</a>
    <div class="title">🎈 Pop & Count</div>
    <div style="display:flex;gap:10px;">
        <button class="icon-btn" id="soundBtn">🔊</button>
        <button class="icon-btn" id="fsBtn" aria-label="Fullscreen">⛶</button>
    </div>
</div>
<div class="counter"><span id="countDisplay">0</span><span class="label">pops</span></div>
<main class="stage">
    <canvas id="popCanvas"></canvas>
</main>
<script src="../js/common.js"></script>
<script src="../js/sound-toggle.js"></script>
<script src="../js/page-init.js"></script>
<script>
const BALLOON_COLORS = [
    { color: "#e4572e", highlight: "#ff7a4a" },
    { color: "#ff9f1c", highlight: "#ffb84d" },
    { color: "#ffc93c", highlight: "#ffe06b" },
    { color: "#8ac926", highlight: "#a8e650" },
    { color: "#17b978", highlight: "#40e0a0" },
    { color: "#209ce7", highlight: "#5abfff" },
    { color: "#4361ee", highlight: "#7a8bff" },
    { color: "#9b5de5", highlight: "#c48dff" },
    { color: "#f15bb5", highlight: "#ff8ad1" },
    { color: "#8d5524", highlight: "#c98040" }
];

const canvas = document.getElementById("popCanvas");
const ctx = canvas.getContext("2d");
let dpr = window.devicePixelRatio || 1;
let count = 0;
let balloons = [];
let animId = null;
let spawnTimer = null;
let lastTime = 0;

function resize() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
}
window.addEventListener("resize", resize);
resize();

function spawnBalloon() {
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    const r = 38 + Math.random() * 22;
    const bc = BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)];
    balloons.push({
        x: r + Math.random() * (w - 2 * r),
        y: h + r + 20,
        r,
        color: bc.color,
        highlight: bc.highlight,
        vy: -(1.4 + Math.random() * 1.0),
        vx: (Math.random() - 0.5) * 0.5,
        popped: false,
        popAnim: 0,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.02 + Math.random() * 0.02
    });
}

function drawBalloon(b) {
    if (b.popped) {
        drawPop(b);
        return;
    }
    b.wobble += b.wobbleSpeed;
    const wx = Math.sin(b.wobble) * 3;

    const grad = ctx.createRadialGradient(b.x + wx - b.r * 0.3, b.y - b.r * 0.3, 0, b.x + wx, b.y, b.r);
    grad.addColorStop(0, lighten(b.color, 35));
    grad.addColorStop(0.4, b.color);
    grad.addColorStop(1, darken(b.color, 25));
    ctx.beginPath();
    ctx.ellipse(b.x + wx, b.y, b.r, b.r * 1.18, 0, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Highlight
    const hgrad = ctx.createRadialGradient(b.x + wx - b.r * 0.35, b.y - b.r * 0.35, 0, b.x + wx - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.5);
    hgrad.addColorStop(0, "rgba(255,255,255,0.4)");
    hgrad.addColorStop(1, "rgba(255,255,255,0)");
    ctx.beginPath();
    ctx.ellipse(b.x + wx, b.y, b.r * 0.7, b.r * 0.8, 0, 0, Math.PI * 2);
    ctx.fillStyle = hgrad;
    ctx.fill();

    // String
    ctx.beginPath();
    ctx.moveTo(b.x + wx, b.y + b.r * 1.18);
    ctx.quadraticCurveTo(b.x + wx, b.y + b.r * 1.4, b.x + wx + 2, b.y + b.r * 1.7);
    ctx.strokeStyle = "rgba(0,0,0,0.3)";
    ctx.lineWidth = 2;
    ctx.stroke();
}

function drawPop(b) {
    b.popAnim += 0.18;
    if (b.popAnim > 1) return;
    const particles = 14;
    for (let i = 0; i < particles; i++) {
        const angle = (i / particles) * Math.PI * 2;
        const dist = b.popAnim * b.r * 2.8;
        const px = b.x + Math.cos(angle) * dist;
        const py = b.y + Math.sin(angle) * dist;
        const pr = (1 - b.popAnim) * (8 + Math.random() * 6);
        ctx.beginPath();
        ctx.arc(px, py, pr, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();
    }
    // Center flash
    const flashR = (1 - b.popAnim) * b.r * 1.5;
    const fgrad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, flashR);
    fgrad.addColorStop(0, "rgba(255,255,255,0.8)");
    fgrad.addColorStop(1, "rgba(255,255,255,0)");
    ctx.beginPath();
    ctx.arc(b.x, b.y, flashR, 0, Math.PI * 2);
    ctx.fillStyle = fgrad;
    ctx.fill();
}

function lighten(c, amt) { const n = parseInt(c.slice(1),16); const r = Math.min(255, (n>>16) + amt); const g = Math.min(255, ((n>>8)&255) + amt); const b = Math.min(255, (n&255) + amt); return "#" + ((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1); }
function darken(c, amt) { const n = parseInt(c.slice(1),16); const r = Math.max(0, (n>>16) - amt); const g = Math.max(0, ((n>>8)&255) - amt); const b = Math.max(0, (n&255) - amt); return "#" + ((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1); }

function animate(time) {
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    balloons = balloons.filter(b => {
        if (b.popped) {
            b.popAnim += 0.15;
            drawPop(b);
            return b.popAnim < 1;
        }
        b.y += b.vy;
        b.x += b.vx;
        if (b.x < b.r) { b.x = b.r; b.vx *= -1; }
        if (b.x > w - b.r) { b.x = w - b.r; b.vx *= -1; }
        drawBalloon(b);
        return b.y > -b.r;
    });
    animId = requestAnimationFrame(animate);
}

function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (e.clientX || e.touches?.[0]?.clientX || 0) - rect.left,
        y: (e.clientY || e.touches?.[0]?.clientY || 0) - rect.top
    };
}

canvas.addEventListener("pointerdown", e => {
    const p = getCanvasPos(e);
    balloons.forEach(b => {
        if (!b.popped) {
            const dx = p.x - b.x;
            const dy = p.y - b.y;
            if (dx*dx + dy*dy <= b.r * b.r) {
                popBalloon(b);
            }
        }
    });
});

function popBalloon(b) {
    if (b.popped) return;
    b.popped = true;
    b.popAnim = 0;
    count++;
    updateCount();
    TotAudio.tap();
    playPopSound();
    confetti(600);
}

function updateCount() {
    document.getElementById("countDisplay").textContent = count;
}

function playPopSound() {
    if (TotAudio.isMuted()) return;
    const ctx = TotAudio.unlock();
    if (!ctx) return;
    // Satisfying pop: quick pitch drop with noise burst
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    const noise = ctx.createBufferSource();
    const bufferSize = ctx.sampleRate * 0.1;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    noise.buffer = buffer;
    const noiseGain = ctx.createGain();
    
    o.type = "sine";
    o.frequency.setValueAtTime(800, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.12);
    g.gain.setValueAtTime(0.25, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    o.connect(g).connect(ctx.destination);
    
    noise.connect(noiseGain).connect(ctx.destination);
    noiseGain.gain.setValueAtTime(0.15, ctx.currentTime);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    
    o.start();
    o.stop(ctx.currentTime + 0.12);
    noise.start();
}

function updateCount() {
    document.getElementById("countDisplay").textContent = count;
}

function startSpawning() {
    spawnTimer = setInterval(spawnBalloon, 900);
}
function stopSpawning() {
    clearInterval(spawnTimer);
}

animate(0);
startSpawning();

window.addEventListener("beforeunload", () => { stopSpawning(); cancelAnimationFrame(animId); });
</script>
</body>
</html>
