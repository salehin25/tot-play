    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
}
window.addEventListener("resize", resize);
resize();

function getCanvasPoint(normX, normY) {
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    const scale = Math.min(w, h) * 0.7;
    const cx = w / 2;
    const cy = h / 2;
    return {
        x: cx + (normX - 0.5) * scale,
        y: cy + (normY - 0.5) * scale
    };
}

function drawStrokePath(stroke) {
    const path = new Path2D();
    let firstPoint = true;
    for (const cmd of stroke) {
        const pts = cmd.points;
        if (cmd.type === 'M') {
            const p = getCanvasPoint(pts[0], pts[1]);
            path.moveTo(p.x, p.y);
        } else if (cmd.type === 'L') {
            const p = getCanvasPoint(pts[0], pts[1]);
            path.lineTo(p.x, p.y);
        } else if (cmd.type === 'Q') {
            // Q: cp1x, cp1y, x, y
            const cp = getCanvasPoint(pts[0], pts[1]);
            const end = getCanvasPoint(pts[2], pts[3]);
            path.quadraticCurveTo(cp.x, cp.y, end.x, end.y);
        }
    }
    return path;
}

function drawLetterGuide() {
    const strokes = LETTER_STROKES[LETTERS[currentLetterIdx]] || [];
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;

    ctx.strokeStyle = "rgba(25, 84, 123, 0.18)";
    ctx.lineWidth = Math.max(8, Math.min(w, h) * 0.07);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    for (const stroke of LETTER_STROKES[LETTERS[currentLetterIdx]] || []) {
        const path = drawStrokePath(stroke);
        ctx.stroke(path);
    }
}

function drawCompletedStrokes() {
    const color = STROKE_COLORS[currentLetterIdx % STROKE_COLORS.length];
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(10, Math.min(canvas.width / dpr, canvas.height / dpr) * 0.08);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    for (let i = 0; i <= currentStrokeIdx && i < completedStrokes.length; i++) {
        const path = drawStrokePath((LETTER_STROKES[LETTERS[currentLetterIdx]] || [])[i]);
        ctx.stroke(path);
    }
}

function drawCurrentTrail() {
    if (!isDrawing || currentTrail.length < 2) return;
    const color = STROKE_COLORS[currentLetterIdx % STROKE_COLORS.length];
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(10, Math.min(canvas.width / dpr, canvas.height / dpr) * 0.08);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.globalCompositeOperation = "source-over";
    ctx.beginPath();
    ctx.moveTo(currentTrail[0].x, currentTrail[0].y);
    for (let i = 1; i < currentTrail.length; i++) {
        ctx.lineTo(currentTrail[i].x, currentTrail[i].y);
    }
    ctx.stroke();
}

function drawGuide() {
    const strokes = LETTER_STROKES[LETTERS[currentLetterIdx]] || [];
    if (currentStrokeIdx >= strokes.length) return;
    const stroke = strokes[currentStrokeIdx];

    const totalPoints = 20;
    const idx = Math.min(guideProgress * (totalPoints - 1), totalPoints - 1);
    const t = idx - Math.floor(idx);
    const i = Math.floor(idx);

    // Sample points along the stroke path
    const points = sampleStrokePath(stroke, totalPoints);
    if (i >= points.length - 1) return;

    const p1 = points[i];
    const p2 = points[i + 1];
    const x = p1.x + (p2.x - p1.x) * t;
    const y = p1.y + (p2.y - p1.y) * t;

    ctx.save();
    ctx.translate(x, y);
    const pulse = Math.sin(Date.now() / 200) * 0.15 + 1;
    ctx.scale(pulse, pulse);
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.fillStyle = "#209ce7";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -8, 6, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 2, 3, 0, Math.PI * 2);
    ctx.fillStyle = "#333";
    ctx.fill();
    ctx.restore();
}

function sampleStrokePath(stroke, count) {
    const points = [];
    const path = new Path2D();
    let started = false;

    for (const cmd of stroke) {
        if (cmd.type === 'M') {
            const p = getCanvasPoint(cmd.points[0], cmd.points[1]);
            if (!started) { path.moveTo(p.x, p.y); started = true; }
            else path.moveTo(p.x, p.y);
        } else if (cmd.type === 'L') {
            const p = getCanvasPoint(cmd.points[0], cmd.points[1]);
            path.lineTo(p.x, p.y);
        } else if (cmd.type === 'Q') {
            const cp = getCanvasPoint(cmd.points[0], cmd.points[1]);
            const end = getCanvasPoint(cmd.points[2], cmd.points[3]);
            path.quadraticCurveTo(cp.x, cp.y, end.x, end.y);
        }
    }

    // Sample points along the path
    const length = path.getTotalLength ? path.getTotalLength() : 0;
    // Use simpler approach - sample from commands directly
    const samples = [];
    for (const cmd of stroke) {
        if (cmd.type === 'M') {
            samples.push(getCanvasPoint(cmd.points[0], cmd.points[1]));
        } else if (cmd.type === 'L') {
            samples.push(getCanvasPoint(cmd.points[0], cmd.points[1]));
        } else if (cmd.type === 'Q') {
            // Add control point and end point for sampling
            samples.push(getCanvasPoint(cmd.points[0], cmd.points[1]));
            samples.push(getCanvasPoint(cmd.points[2], cmd.points[3]));
        }
    }
    return samples.length > 0 ? samples : [{x:0,y:0}];
}

function animateGuide() {
    guideProgress += 0.006;
    if (guideProgress >= 1) guideProgress = 0;
    drawFrame();
    guideAnimId = requestAnimationFrame(animateGuide);
}

function drawFrame() {
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawLetterGuide();
    drawCompletedStrokes();
    drawCurrentTrail();
    if (guideProgress > 0) drawGuide();
}

function speak(text) {
    if (!TotAudio.isMuted() && "speechSynthesis" in window) {
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9; u.pitch = 1.1;
        speechSynthesis.cancel(); speechSynthesis.speak(u);
    }
}

function updateProgress() {
    const total = (LETTER_STROKES[LETTERS[currentLetterIdx]] || []).length;
    const pct = total > 0 ? ((currentStrokeIdx) / total) * 100 : 0;
    document.getElementById("progressFill").style.width = pct + "%";
}

function getStrokePathPoints(strokeIdx) {
    const stroke = (LETTER_STROKES[LETTERS[currentLetterIdx]] || [])[strokeIdx];
    if (!stroke) return [];
    const points = [];
    for (const cmd of stroke) {
        if (cmd.type === 'M') points.push(getCanvasPoint(cmd.points[0], cmd.points[1]));
        else if (cmd.type === 'L') points.push(getCanvasPoint(cmd.points[0], cmd.points[1]));
        else if (cmd.type === 'Q') {
            points.push(getCanvasPoint(cmd.points[0], cmd.points[1]));
            points.push(getCanvasPoint(cmd.points[2], cmd.points[3]));
        }
    }
    return points;
}

function pointToSegmentDist(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    if (dx === 0 && dy === 0) return Math.hypot(px - x1, py - y1);
    const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy)));
    const closestX = x1 + t * dx;
    const closestY = y1 + t * dy;
    return Math.hypot(px - closestX, py - closestY);
}

function checkStrokeComplete(trail) {
    if (trail.length < 8) return false;
    const strokes = LETTER_STROKES[LETTERS[currentLetterIdx]] || [];
    if (currentStrokeIdx >= strokes.length) return false;

    const stroke = strokes[currentStrokeIdx];
    const pathPoints = [];
    // Build a polyline approximation of the stroke
    const path = new Path2D();
    let started = false;
    for (const cmd of stroke) {
        if (cmd.type === 'M') {
            const p = getCanvasPoint(cmd.points[0], cmd.points[1]);
            if (!started) { path.moveTo(p.x, p.y); started = true; }
            else path.moveTo(p.x, p.y);
        } else if (cmd.type === 'L') {
            const p = getCanvasPoint(cmd.points[0], cmd.points[1]);
            path.lineTo(p.x, p.y);
        } else if (cmd.type === 'Q') {
            const cp = getCanvasPoint(cmd.points[0], cmd.points[1]);
            const end = getCanvasPoint(cmd.points[2], cmd.points[3]);
            path.quadraticCurveTo(cp.x, cp.y, end.x, end.y);
        }
    }

    // Sample the path
    const segCount = 30;
    const samplePoints = [];
    try {
        const len = path.getTotalLength ? path.getTotalLength() : 0;
        // Can't easily sample Path2D, use command-based sampling instead
    } catch(e) {}

    // Simpler: build polyline from commands
    const polyPoints = [];
    for (const cmd of stroke) {
        if (cmd.type === 'M') polyPoints.push(getCanvasPoint(cmd.points[0], cmd.points[1]));
        else if (cmd.type === 'L') polyPoints.push(getCanvasPoint(cmd.points[0], cmd.points[1]));
        else if (cmd.type === 'Q') {
            // Subdivide bezier
            const steps = 10;
            for (let s = 1; s <= steps; s++) {
                const t = s / steps;
                const p0 = getCanvasPoint(stroke[0].points[0], stroke[0].points[1]); // approximation
            }
        }
    }

    // Even simpler: check if trail end is near stroke end
    const strokeCmds = stroke;
    let endPt = null;
    for (let i = strokeCmds.length - 1; i >= 0; i--) {
        const cmd = strokeCmds[i];
        if (cmd.type === 'L' || cmd.type === 'Q') {
            const lastIdx = cmd.type === 'L' ? 0 : 2;
            endPt = getCanvasPoint(cmd.points[lastIdx * 2], cmd.points[lastIdx * 2 + 1]);
            break;
        }
    }
    if (!endPt && stroke.length > 0) {
        const first = stroke[0];
        endPt = getCanvasPoint(first.points[0], first.points[1]);
    }

    const lastTrail = trail[trail.length - 1];
    if (!endPt) return false;

    const dist = Math.hypot(lastTrail.x - endPt.x, lastTrail.y - endPt.y);
    const threshold = Math.max(25, Math.min(canvas.width / dpr, canvas.height / dpr) * 0.05);
    return dist < threshold;
}

function strokeMatchesPath(trail, strokeIdx) {
    // Check if the trail roughly follows the intended stroke path
    const stroke = (LETTER_STROKES[LETTERS[currentLetterIdx]] || [])[strokeIdx];
    if (!stroke || trail.length < 5) return false;

    // Sample reference points along the stroke
    const refPoints = [];
    for (const cmd of stroke) {
        if (cmd.type === 'M') refPoints.push(getCanvasPoint(cmd.points[0], cmd.points[1]));
        else if (cmd.type === 'L') refPoints.push(getCanvasPoint(cmd.points[0], cmd.points[1]));
        else if (cmd.type === 'Q') {
            refPoints.push(getCanvasPoint(cmd.points[0], cmd.points[1]));
            refPoints.push(getCanvasPoint(cmd.points[2], cmd.points[3]));
        }
    }

    // Check if trail points stay close to reference path
    let closeCount = 0;
    for (const tp of trail) {
        let minDist = Infinity;
        for (let i = 0; i < refPoints.length - 1; i++) {
            const d = pointToSegmentDist(tp.x, tp.y, refPoints[i].x, refPoints[i].y, refPoints[i+1].x, refPoints[i+1].y);
            minDist = Math.min(minDist, d);
        }
        if (minDist < Math.max(30, Math.min(canvas.width/dpr, canvas.height/dpr) * 0.06)) closeCount++;
    }
    return closeCount / trail.length > 0.5;
}

let currentTrail = [];

function onPointerDown(e) {
    isDrawing = true;
    currentTrail = [];
    const p = getCanvasPos(e);
    currentTrail.push(p);
    cancelAnimationFrame(guideAnimId);
    guideProgress = 0;
}

function onPointerMove(e) {
    if (!isDrawing) return;
    e.preventDefault();
    const p = getCanvasPos(e);
    currentTrail.push(p);
    drawFrame();
    drawCurrentTrail();
}

function onPointerUp(e) {
    if (!isDrawing) return;
    isDrawing = false;

    const ok = strokeMatchesPath(currentTrail, currentStrokeIdx) && checkStrokeComplete(currentTrail);

    if (ok) {
        completedStrokes.push([...currentTrail]);
        currentStrokeIdx++;
        TotAudio.match();
        updateProgress();

        const strokes = LETTER_STROKES[LETTERS[currentLetterIdx]] || [];
        if (currentStrokeIdx >= strokes.length) {
            letterCompleted();
        } else {
            guideProgress = 0;
            animateGuide();
        }
    } else {
        // Gentle shake feedback
        TotAudio.wrong();
        guideProgress = 0;
        animateGuide();
    }
    currentTrail = [];
}

function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (e.clientX || e.touches?.[0]?.clientX || 0) - rect.left,
        y: (e.clientY || e.touches?.[0]?.clientY || 0) - rect.top
    };
}

function letterCompleted() {
    cancelAnimationFrame(guideAnimId);
    TotAudio.win();
    confetti(2000);
    const letter = LETTERS[currentLetterIdx];
    speak(`${letter} is for ${WORDS[letter]}!`);
    document.getElementById("letterInfo").textContent = `${letter} is for ${WORDS[letter]}`;
    document.getElementById("progressFill").style.width = "100%";

    setTimeout(() => {
        currentLetterIdx = (currentLetterIdx + 1) % LETTERS.length;
        currentStrokeIdx = 0;
        completedStrokes = [];
        document.getElementById("letterInfo").textContent = LETTERS[currentLetterIdx];
        document.getElementById("progressFill").style.width = "0%";
        guideProgress = 0;
        animateGuide();
    }, 2000);
}

canvas.addEventListener("pointerdown", onPointerDown);
canvas.addEventListener("pointermove", onPointerMove);
canvas.addEventListener("pointerup", onPointerUp);
canvas.addEventListener("pointercancel", onPointerUp);

animateGuide();
</script>
