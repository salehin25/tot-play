<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ee9ca7">
    <title>Pop & Count</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../icons/favicon.png">
    <link rel="apple-touch-icon" href="../icons/favicon.png">
    <link rel="stylesheet" href="../css/shared.css">
    <style>
        .topbar { z-index: 20; }
        main.stage { position: relative; padding: 0; }
        canvas#popCanvas { display: block; width: 100%; height: 100%; touch-action: none; }

        .counter {
            position: fixed;
            top: max(60px, env(safe-area-inset-top) + 60px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            padding: 8px 28px;
            border-radius: 999px;
            font-weight: 800;
            font-size: clamp(1.5rem, 5vh, 2.5rem);
            color: var(--ink);
            z-index: 10;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .counter .label {
            font-size: clamp(0.7rem, 2vh, 0.9rem);
            opacity: 0.6;
            font-weight: 700;
        }

        .surprise-text {
            position: fixed;
            font-size: clamp(5rem, 12vh, 8rem);
            font-weight: 900;
            pointer-events: none;
            z-index: 1000;
            animation: surpriseZoom 1.2s ease-out forwards;
            filter: drop-shadow(0 0 30px rgba(255,255,255,1)) drop-shadow(0 6px 0 rgba(0,0,0,0.4));
        }

        @keyframes surpriseZoom {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-30deg); opacity: 0; }
            25% { transform: translate(-50%, -50%) scale(1.4) rotate(10deg); opacity: 1; }
            70% { transform: translate(-50%, -80%) scale(1.2) rotate(-5deg); opacity: 1; }
            100% { transform: translate(-50%, -200%) scale(0.8) rotate(0deg); opacity: 0; }
        }
    </style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<div class="topbar">
    <a class="home-btn" href="../index.html">🏠</a>
    <div class="title">🎈 Pop & Count</div>
    <div style="display:flex;gap:10px;">
        <button class="icon-btn" id="soundBtn">🔊</button>
        <button class="icon-btn" id="fsBtn" aria-label="Fullscreen">⛶</button>
    </div>
</div>
<div class="counter">
    <span id="countDisplay">0</span>
    <span class="label" id="nextMilestone">Next: 10</span>
</div>
<main class="stage">
    <canvas id="popCanvas"></canvas>
</main>
<script src="../js/common.js"></script>
<script src="../js/sound-toggle.js"></script>
<script src="../js/page-init.js"></script>
<script>
const BALLOON_COLORS = [
    { color: "#e4572e", highlight: "#ff7a4a" },
    { color: "#ff9f1c", highlight: "#ffb84d" },
    { color: "#ffc93c", highlight: "#ffe06b" },
    { color: "#8ac926", highlight: "#a8e650" },
    { color: "#17b978", highlight: "#40e0a0" },
    { color: "#209ce7", highlight: "#5abfff" },
    { color: "#4361ee", highlight: "#7a8bff" },
    { color: "#9b5de5", highlight: "#c48dff" },
    { color: "#f15bb5", highlight: "#ff8ad1" }
];

const SURPRISE_LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const SURPRISE_NUMBERS = "0123456789".split("");
const SURPRISE_EMOJIS = ["🐶","🐱","🦁","🐘","🐮","🐷","🐸","🐻","🐰","🐼","🚗","🚕","✈️","🚁","🚂","⭐","🌈","☀️","🌸","💐","🎈","🍎","🍌","🍉","⚽","🏀"];
const MILESTONES = [10, 25, 50, 100, 150, 200, 300, 500];

const SURPRISE_COLORS = ["#ff6b81", "#4d96ff", "#17b978", "#ff9f1c", "#9b5de5", "#f15bb5"];

const canvas = document.getElementById("popCanvas");
const ctx = canvas.getContext("2d");
let dpr = window.devicePixelRatio || 1;
let count = 0;
let balloons = [];
let animId = null;
let spawnTimer = null;

function resize() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
}
window.addEventListener("resize", resize);
resize();

function spawnBalloon() {
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    const r = 42 + Math.random() * 18;

    // Determine balloon type
    const rand = Math.random();
    let type = "normal";
    let overlay = null;
    let bc = BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)];

    if (rand < 0.05) {
        type = "star";
        overlay = "⭐";
    } else if (rand < 0.10) {
        type = "heart";
        overlay = "❤️";
    } else if (rand < 0.15) {
        type = "rainbow";
    } else if (rand < 0.20) {
        type = "golden";
        bc = { color: "#ffd700", highlight: "#ffed4e" };
    }

    balloons.push({
        x: r + Math.random() * (w - 2 * r),
        y: h + r + 20,
        r,
        color: bc.color,
        highlight: bc.highlight,
        type,
        overlay,
        vy: -(1.5 + Math.random() * 0.8),
        vx: (Math.random() - 0.5) * 0.6,
        popped: false,
        popAnim: 0,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.015 + Math.random() * 0.015,
        fragments: [] // For pop animation
    });
}

function drawBalloon(b) {
    if (b.popped) {
        drawPop(b);
        return;
    }

    b.wobble += b.wobbleSpeed;
    const wx = Math.sin(b.wobble) * 4;
    const bx = b.x + wx;
    const by = b.y;

    // Rainbow gradient for rainbow type
    if (b.type === "rainbow") {
        const rainbowGrad = ctx.createLinearGradient(bx - b.r, by - b.r, bx + b.r, by + b.r);
        rainbowGrad.addColorStop(0, "#ff6b6b");
        rainbowGrad.addColorStop(0.25, "#ffc93c");
        rainbowGrad.addColorStop(0.5, "#17b978");
        rainbowGrad.addColorStop(0.75, "#4d96ff");
        rainbowGrad.addColorStop(1, "#9b5de5");
        ctx.fillStyle = rainbowGrad;
    } else {
        // Multi-stop gradient for depth
        const grad = ctx.createRadialGradient(bx - b.r * 0.4, by - b.r * 0.4, 0, bx, by, b.r);
        grad.addColorStop(0, lighten(b.color, 50));
        grad.addColorStop(0.3, lighten(b.color, 20));
        grad.addColorStop(0.7, b.color);
        grad.addColorStop(1, darken(b.color, 30));
        ctx.fillStyle = grad;
    }

    // Main balloon body
    ctx.beginPath();
    ctx.ellipse(bx, by, b.r, b.r * 1.2, 0, 0, Math.PI * 2);
    ctx.fill();

    // Large glossy highlight
    const highlight = ctx.createRadialGradient(
        bx - b.r * 0.35, by - b.r * 0.45, 0,
        bx - b.r * 0.3, by - b.r * 0.35, b.r * 0.65
    );
    highlight.addColorStop(0, "rgba(255,255,255,0.8)");
    highlight.addColorStop(0.4, "rgba(255,255,255,0.4)");
    highlight.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = highlight;
    ctx.beginPath();
    ctx.ellipse(bx, by, b.r * 0.75, b.r * 0.85, 0, 0, Math.PI * 2);
    ctx.fill();

    // Secondary small reflection
    const reflect = ctx.createRadialGradient(
        bx + b.r * 0.25, by - b.r * 0.15, 0,
        bx + b.r * 0.25, by - b.r * 0.15, b.r * 0.35
    );
    reflect.addColorStop(0, "rgba(255,255,255,0.5)");
    reflect.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = reflect;
    ctx.beginPath();
    ctx.arc(bx + b.r * 0.25, by - b.r * 0.15, b.r * 0.35, 0, Math.PI * 2);
    ctx.fill();

    // String with knot
    ctx.beginPath();
    ctx.moveTo(bx, by + b.r * 1.2);
    ctx.quadraticCurveTo(bx + wx * 0.5, by + b.r * 1.5, bx + wx * 0.3, by + b.r * 1.9);
    ctx.strokeStyle = "rgba(0,0,0,0.25)";
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Knot at bottom
    ctx.beginPath();
    ctx.arc(bx, by + b.r * 1.2, 3, 0, Math.PI * 2);
    ctx.fillStyle = darken(b.color, 40);
    ctx.fill();

    // Overlay emoji for special balloons
    if (b.overlay) {
        ctx.font = `${b.r * 0.8}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(b.overlay, bx, by);
    }
}

function drawPop(b) {
    const progress = b.popAnim;

    // Initialize fragments on first frame - create stretchy rubber pieces
    if (b.fragments.length === 0) {
        const numFragments = 6 + Math.floor(Math.random() * 4); // 6-10 larger pieces
        for (let i = 0; i < numFragments; i++) {
            b.fragments.push({
                angle: (i / numFragments) * Math.PI * 2 + (Math.random() - 0.5) * 0.8,
                speed: 2.2 + Math.random() * 1.5,
                rotation: (Math.random() - 0.5) * 12,
                initialRotation: Math.random() * Math.PI * 2,
                size: 0.4 + Math.random() * 0.3,
                stretchX: 0.7 + Math.random() * 0.6,
                stretchY: 0.8 + Math.random() * 0.5,
                curve1: Math.random() - 0.5,
                curve2: Math.random() - 0.5
            });
        }
    }

    const fadeStart = 0.6;

    // Draw stretchy rubber-like fragments
    b.fragments.forEach(frag => {
        const easeProgress = progress < 0.4 ? progress / 0.4 : 1;
        const dist = easeProgress * b.r * 4.2 * frag.speed;
        const px = b.x + Math.cos(frag.angle) * dist;
        const py = b.y + Math.sin(frag.angle) * dist;

        // Size gets smaller as it flies outward
        const sizeProgress = Math.min(1, progress / 0.7);
        const baseSize = b.r * frag.size;
        const currentSize = baseSize * (1 - sizeProgress * 0.6);

        // Fade out in later stage
        const alpha = progress < fadeStart ? 0.75 : (1 - ((progress - fadeStart) / (1 - fadeStart))) * 0.75;

        const rotation = frag.initialRotation + frag.rotation * progress * 2;

        if (currentSize < 2 || alpha < 0.05) return;

        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(rotation);
        ctx.globalAlpha = alpha;

        // Draw stretchy, irregular latex-like piece
        const w = currentSize * frag.stretchX;
        const h = currentSize * frag.stretchY;

        ctx.beginPath();
        ctx.moveTo(w, 0);

        // Top right curve - irregular
        ctx.bezierCurveTo(
            w + w * frag.curve1, h * 0.3,
            w * 0.7, h + h * frag.curve2,
            0, h
        );

        // Bottom left curve - irregular
        ctx.bezierCurveTo(
            -w * 0.3 + w * frag.curve1, h,
            -w, h * 0.7 + h * frag.curve2,
            -w, 0
        );

        // Top left curve - irregular
        ctx.bezierCurveTo(
            -w, -h * 0.5 + h * frag.curve1,
            -w * 0.5, -h + h * frag.curve2,
            0, -h
        );

        // Top right curve back - irregular
        ctx.bezierCurveTo(
            w * 0.5 + w * frag.curve2, -h,
            w, -h * 0.5 + h * frag.curve1,
            w, 0
        );

        ctx.closePath();

        // Fill with gradient for depth
        const fragGrad = ctx.createRadialGradient(-w * 0.3, -h * 0.3, 0, 0, 0, Math.max(w, h));
        fragGrad.addColorStop(0, lighten(b.color, 30));
        fragGrad.addColorStop(0.7, b.color);
        fragGrad.addColorStop(1, darken(b.color, 20));
        ctx.fillStyle = fragGrad;
        ctx.fill();

        // Add slight edge darkening for latex effect
        ctx.strokeStyle = darken(b.color, 40);
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = alpha * 0.4;
        ctx.stroke();

        ctx.restore();
    });

    // Bright flash only at the very start
    if (progress < 0.15) {
        const flashProgress = progress / 0.15;
        const flashR = (1 - flashProgress) * b.r * 2.5;
        const flashAlpha = (1 - flashProgress) * 0.95;

        const fgrad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, flashR);
        fgrad.addColorStop(0, `rgba(255,255,255,${flashAlpha})`);
        fgrad.addColorStop(0.5, `rgba(255,255,255,${flashAlpha * 0.4})`);
        fgrad.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = fgrad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, flashR, 0, Math.PI * 2);
        ctx.fill();
    }
}

function lighten(c, amt) {
    const n = parseInt(c.slice(1), 16);
    const r = Math.min(255, (n >> 16) + amt);
    const g = Math.min(255, ((n >> 8) & 255) + amt);
    const b = Math.min(255, (n & 255) + amt);
    return "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

function darken(c, amt) {
    const n = parseInt(c.slice(1), 16);
    const r = Math.max(0, (n >> 16) - amt);
    const g = Math.max(0, ((n >> 8) & 255) - amt);
    const b = Math.max(0, (n & 255) - amt);
    return "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

function animate() {
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    balloons = balloons.filter(b => {
        if (b.popped) {
            b.popAnim += 0.22;
            drawPop(b);
            return b.popAnim < 1;
        }
        b.y += b.vy;
        b.x += b.vx;
        if (b.x < b.r) { b.x = b.r; b.vx *= -1; }
        if (b.x > w - b.r) { b.x = w - b.r; b.vx *= -1; }
        drawBalloon(b);
        return b.y > -b.r - 50;
    });

    animId = requestAnimationFrame(animate);
}

function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (e.clientX || e.touches?.[0]?.clientX || 0) - rect.left,
        y: (e.clientY || e.touches?.[0]?.clientY || 0) - rect.top
    };
}

canvas.addEventListener("pointerdown", e => {
    e.preventDefault(); // Prevent default touch behavior
    handlePop(e);
});

// Enable multi-touch - handle all touches simultaneously
canvas.addEventListener("pointermove", e => {
    if (e.pointerType === "touch" && e.buttons > 0) {
        handlePop(e);
    }
});

function handlePop(e) {
    const p = getCanvasPos(e);
    balloons.forEach(b => {
        if (!b.popped) {
            const dx = p.x - b.x;
            const dy = p.y - b.y;
            if (dx * dx + dy * dy <= b.r * b.r * 1.2 * 1.2) {
                popBalloon(b, p.x, p.y);
            }
        }
    });
}

function popBalloon(b, screenX, screenY) {
    if (b.popped) return;

    b.popped = true;
    b.popAnim = 0;
    count++;
    updateCount();

    playPopSound();

    // Extra effects for special balloons
    if (b.type === "star" || b.type === "golden") {
        confetti(1000);
        TotAudio.pick();
    } else if (b.type === "heart") {
        confetti(800);
    }

    // 30% chance of surprise element
    if (Math.random() < 0.3) {
        showSurprise(screenX, screenY);
    }

    // Check milestones
    if (MILESTONES.includes(count)) {
        celebrate();
    }
}

function showSurprise(x, y) {
    const type = Math.floor(Math.random() * 3);
    let content;

    if (type === 0) {
        content = SURPRISE_LETTERS[Math.floor(Math.random() * SURPRISE_LETTERS.length)];
    } else if (type === 1) {
        content = SURPRISE_NUMBERS[Math.floor(Math.random() * SURPRISE_NUMBERS.length)];
    } else {
        content = SURPRISE_EMOJIS[Math.floor(Math.random() * SURPRISE_EMOJIS.length)];
    }

    const surprise = document.createElement("div");
    surprise.className = "surprise-text";
    surprise.textContent = content;
    surprise.style.color = SURPRISE_COLORS[Math.floor(Math.random() * SURPRISE_COLORS.length)];
    surprise.style.left = x + "px";
    surprise.style.top = y + "px";
    document.body.appendChild(surprise);

    TotAudio.match();
    setTimeout(() => surprise.remove(), 1000);
}

function celebrate() {
    TotAudio.win();
    confetti(2500);
    bigMessage("Amazing! 🎉");

    stopSpawning();
    setTimeout(startSpawning, 2500);
}

function updateCount() {
    document.getElementById("countDisplay").textContent = count;

    // Show next milestone
    const nextMilestone = MILESTONES.find(m => m > count);
    if (nextMilestone) {
        document.getElementById("nextMilestone").textContent = `Next: ${nextMilestone}`;
    } else {
        document.getElementById("nextMilestone").textContent = "🌟 Champion!";
    }
}

function playPopSound() {
    if (TotAudio.isMuted()) return;
    const audioCtx = TotAudio.unlock();
    if (!audioCtx) return;

    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();

    o.type = "triangle";
    const pitch = 1200 + Math.random() * 250;
    o.frequency.setValueAtTime(pitch, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);

    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

    o.connect(g).connect(audioCtx.destination);

    // Brief noise puff
    const noise = audioCtx.createBufferSource();
    const bufferSize = audioCtx.sampleRate * 0.05;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    noise.buffer = buffer;

    const noiseGain = audioCtx.createGain();
    noise.connect(noiseGain).connect(audioCtx.destination);
    noiseGain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

    o.start();
    o.stop(audioCtx.currentTime + 0.1);
    noise.start();
    noise.stop(audioCtx.currentTime + 0.05);
}

function startSpawning() {
    spawnTimer = setInterval(spawnBalloon, 850);
}

function stopSpawning() {
    clearInterval(spawnTimer);
}

animate();
startSpawning();

window.addEventListener("beforeunload", () => {
    stopSpawning();
    cancelAnimationFrame(animId);
});
</script>
</body>
</html>
