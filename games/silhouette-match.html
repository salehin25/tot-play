<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fbc2eb">
    <title>Silhouette Match</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../icons/favicon.png">
    <link rel="apple-touch-icon" href="../icons/favicon.png">
    <link rel="stylesheet" href="../css/shared.css">
    <style>
        .topbar { z-index: 20; }
        main.stage { padding: clamp(10px, 2vh, 20px); gap: clamp(10px, 2vh, 16px); }
        .silhouette-row { display: flex; justify-content: center; gap: clamp(16px, 4vw, 40px); flex-wrap: wrap; }
        .silhouette-slot {
            position: relative;
            width: clamp(110px, 20vw, 160px);
            height: clamp(110px, 20vw, 160px);
            border-radius: 20px;
            background: rgba(255,255,255,0.15);
            border: 4px dashed rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s, transform 0.1s;
        }
        .silhouette-slot.correct {
            background: rgba(23,185,120,0.3);
            border-color: #17b978;
            border-style: solid;
        }
        .silhouette-slot img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            /* Create silhouette effect: grayscale + high contrast */
            filter: grayscale(1) brightness(0) contrast(10) drop-shadow(0 0 6px rgba(0,0,0,0.8));
        }
        .silhouette-slot.correct img {
            filter: none; /* Show full color when matched */
        }
        .pieces-row { display: flex; justify-content: center; gap: clamp(16px, 4vw, 40px); flex-wrap: wrap; margin-top: clamp(10px, 2vh, 20px); }
        .piece {
            position: relative;
            width: clamp(110px, 20vw, 160px);
            height: clamp(110px, 20vw, 160px);
            border-radius: 20px;
            background: var(--card);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            touch-action: none;
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 10;
        }
        .piece:active { cursor: grabbing; }
        .piece.dragging {
            transform: scale(1.1);
            box-shadow: 0 16px 32px rgba(36,49,94,0.3);
            z-index: 1000;
            opacity: 0.95;
        }
        .piece img { width: 85%; height: 85%; object-fit: contain; pointer-events: none; user-select: none; }
        .piece.placed { cursor: default; pointer-events: none; }
        .hint-text { text-align: center; font-size: clamp(1rem, 3vh, 1.3rem); font-weight: 700; color: rgba(255,255,255,0.9); text-shadow: 0 2px 0 rgba(36,49,94,0.25); }
    </style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<div class="topbar">
    <a class="home-btn" href="../index.html">🏠</a>
    <div class="title">🧩 Silhouette Match</div>
    <div style="display:flex;gap:10px;">
        <button class="icon-btn" id="soundBtn">🔊</button>
        <button class="icon-btn" id="fsBtn" aria-label="Fullscreen">⛶</button>
    </div>
</div>
<main class="stage">
    <p class="hint-text">Drag the picture to its shadow</p>
    <div class="silhouette-row" id="silhouettes"></div>
    <div class="pieces-row" id="pieces"></div>
</main>
<script src="../js/common.js"></script>
<script src="../js/sound-toggle.js"></script>
<script src="../js/page-init.js"></script>
<script>
// Use the same images from the coloring game (img/ folder)
const COLORING_ITEMS = [
    { name: "Clownfish", src: "../img/clownfish.png" },
    { name: "Turtle", src: "../img/turtle.png" },
    { name: "Flower", src: "../img/flower.png" },
    { name: "Daisy", src: "../img/daisy.png" },
    { name: "Lion Cub", src: "../img/lion-cub.png" },
    { name: "Bear Cub", src: "../img/bear-cub.png" },
    { name: "Lion", src: "../img/lion.png" },
    { name: "Fish", src: "../img/fish.png" },
    { name: "Sun", src: "../img/sun.png" },
    { name: "Cloud", src: "../img/cloud.png" },
    { name: "Rainbow", src: "../img/rainbow.png" },
    { name: "Flower 2", src: "../img/flower2.png" },
    { name: "Butterfly", src: "../img/butterfly.png" },
    { name: "Car", src: "../img/car.png" },
    { name: "Rocket", src: "../img/rocket.png" },
    { name: "Cat", src: "../img/cat.png" },
    { name: "Tree", src: "../img/tree.png" },
    { name: "Apple", src: "../img/apple.png" },
    { name: "Star", src: "../img/star.png" },
    { name: "Duck", src: "../img/duck.png" },
    { name: "Sailboat", src: "../img/sailboat.png" },
    { name: "Airplane", src: "../img/airplane.png" },
    { name: "Ladybug", src: "../img/ladybug.png" },
    { name: "Ice Cream", src: "../img/ice-cream.png" },
    { name: "Helicopter", src: "../img/helicopter.png" },
    { name: "Tractor", src: "../img/tractor.png" }
];

let currentSet = [];
let draggedPiece = null;
let dragData = null;
let piecesContainer = null;
let silhouettesContainer = null;

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function newRound() {
    silhouettesContainer = document.getElementById("silhouettes");
    piecesContainer = document.getElementById("pieces");
    silhouettesContainer.innerHTML = "";
    piecesContainer.innerHTML = "";

    currentSet = shuffle([...COLORING_ITEMS]).slice(0, 4);

    // Create silhouette slots
    currentSet.forEach((item, i) => {
        const slot = document.createElement("div");
        slot.className = "silhouette-slot";
        slot.dataset.name = item.name;
        slot.dataset.index = i;
        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.name;
        img.loading = "";
        slot.appendChild(img);
        silhouettesContainer.appendChild(slot);
    });

    // Create draggable pieces (shuffled)
    const shuffledPieces = shuffle([...currentSet]);
    shuffledPieces.forEach((item, i) => {
        const piece = document.createElement("div");
        piece.className = "piece";
        piece.dataset.name = item.name;
        piece.dataset.index = i;
        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.name;
        img.loading = "";
        piece.appendChild(img);

        // Touch and mouse events
        piece.addEventListener("pointerdown", onDragStart);
        piecesContainer.appendChild(piece);
    });
}

function onDragStart(e) {
    const piece = e.currentTarget;
    if (piece.classList.contains("placed")) return;

    // Prevent default to avoid text selection, scrolling, etc.
    e.preventDefault();

    draggedPiece = piece;
    piece.classList.add("dragging");

    // Get initial position relative to viewport
    const rect = piece.getBoundingClientRect();
    const clientX = e.clientX || e.touches?.[0]?.clientX;
    const clientY = e.clientY || e.touches?.[0]?.clientY;

    dragData = {
        offsetX: clientX - rect.left,
        offsetY: clientY - rect.top,
        startX: rect.left,
        startY: rect.top,
        width: rect.width,
        height: rect.height,
        parent: piece.parentElement,
        nextSibling: piece.nextElementSibling
    };

    // Move to body with fixed positioning for smooth dragging
    piece.style.position = "fixed";
    piece.style.left = (dragData.startX - dragData.offsetX) + "px";
    piece.style.top = (dragData.startY - dragData.offsetY) + "px";
    piece.style.width = dragData.width + "px";
    piece.style.height = dragData.height + "px";
    piece.style.margin = "0";
    piece.style.zIndex = "1000";
    piece.style.transition = "none";
    document.body.appendChild(piece);

    // Set pointer capture to keep receiving events
    try { piece.setPointerCapture(e.pointerId); } catch {}

    TotAudio.pick();

    // Add move/up listeners on document for better tracking
    document.addEventListener("pointermove", onDragMove);
    document.addEventListener("pointerup", onDragEnd);
    document.addEventListener("pointercancel", onDragEnd);
}

function onDragMove(e) {
    if (!draggedPiece || !dragData) return;
    e.preventDefault();

    const clientX = e.clientX || e.touches?.[0]?.clientX;
    const clientY = e.clientY || e.touches?.[0]?.clientY;

    draggedPiece.style.left = (clientX - dragData.offsetX) + "px";
    draggedPiece.style.top = (clientY - dragData.offsetY) + "px";
}

function onDragEnd(e) {
    if (!draggedPiece || !dragData) return;
    e.preventDefault();

    // Remove document listeners
    document.removeEventListener("pointermove", onDragMove);
    document.removeEventListener("pointerup", onDragEnd);
    document.removeEventListener("pointercancel", onDragEnd);

    // Release pointer capture
    try { draggedPiece.releasePointerCapture(e.pointerId); } catch {}

    const pieceName = draggedPiece.dataset.name;
    const slots = document.querySelectorAll(".silhouette-slot");
    let matched = false;

    // Get center point of dragged piece
    const rect = draggedPiece.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    slots.forEach(slot => {
        if (matched) return;
        if (slot.dataset.name === pieceName && !slot.classList.contains("correct")) {
            const slotRect = slot.getBoundingClientRect();
            // Check if center of piece is within slot bounds (with some margin)
            const margin = 20;
            if (cx >= slotRect.left - margin && cx <= slotRect.right + margin &&
                cy >= slotRect.top - margin && cy <= slotRect.bottom + margin) {
                matched = true;
                snapToSlot(draggedPiece, slot);
            }
        }
    });

    if (!matched) {
        returnToStart(draggedPiece);
    }

    draggedPiece = null;
    dragData = null;
}

function snapToSlot(piece, slot) {
    piece.classList.remove("dragging");
    piece.classList.add("placed");

    // Reset inline styles
    piece.style.position = "";
    piece.style.left = "";
    piece.style.top = "";
    piece.style.width = "";
    piece.style.height = "";
    piece.style.margin = "";
    piece.style.zIndex = "";
    piece.style.transition = "";

    // Move piece into slot
    slot.appendChild(piece);
    slot.classList.add("correct");

    // Replace silhouette with colored image (remove silhouette filter)
    const img = slot.querySelector("img");
    if (img) {
        img.style.filter = "none";
    }

    TotAudio.match();
    confetti(1500);
    checkRoundComplete();
}

function returnToStart(piece) {
    piece.classList.remove("dragging");

    // Reset inline styles with animation
    piece.style.position = "";
    piece.style.left = "";
    piece.style.top = "";
    piece.style.width = "";
    piece.style.height = "";
    piece.style.margin = "";
    piece.style.zIndex = "";
    piece.style.transition = "transform 0.3s ease";
    piece.style.transform = "scale(1)";

    // Return to pieces container
    if (piecesContainer) {
        piecesContainer.appendChild(piece);
    }

    // Clean up transition
    setTimeout(() => {
        piece.style.transition = "";
    }, 300);

    TotAudio.wrong();
}

function checkRoundComplete() {
    const correctSlots = document.querySelectorAll(".silhouette-slot.correct");
    if (correctSlots.length === 4) {
        setTimeout(() => {
            TotAudio.win();
            confetti(2000);
            setTimeout(newRound, 1500);
        }, 500);
    }
}

// Start the game
newRound();
</script>
</body>
</html>
