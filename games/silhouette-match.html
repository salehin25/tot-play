<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fbc2eb">
    <title>Silhouette Match</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../icons/favicon.png">
    <link rel="apple-touch-icon" href="../icons/icon-192.png">
    <link rel="stylesheet" href="../css/shared.css">
    <style>
        .topbar { z-index: 20; }
        main.stage { padding: clamp(10px, 2vh, 20px); gap: clamp(10px, 2vh, 16px); }
        .silhouette-row { display: flex; justify-content: center; gap: clamp(16px, 4vw, 40px); flex-wrap: wrap; }
        .silhouette-slot { position: relative; width: clamp(110px, 20vw, 160px); height: clamp(110px, 20vw, 160px); border-radius: 20px; background: rgba(255,255,255,0.15); border: 4px dashed rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; transition: background 0.2s, border-color 0.2s, transform 0.1s; }
        .silhouette-slot.correct { background: rgba(23,185,120,0.3); border-color: #17b978; border-style: solid; }
        .silhouette-slot img { width: 85%; height: 85%; object-fit: contain; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.1)); }
        .pieces-row { display: flex; justify-content: center; gap: clamp(16px, 4vw, 40px); flex-wrap: wrap; margin-top: clamp(10px, 2vh, 20px); }
        .piece { position: relative; width: clamp(110px, 20vw, 160px); height: clamp(110px, 20vw, 160px); border-radius: 20px; background: var(--card); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none; transition: transform 0.2s, box-shadow 0.2s; z-index: 10; }
        .piece:active { cursor: grabbing; }
        .piece.dragging { transform: scale(1.15); box-shadow: 0 16px 0 rgba(36,49,94,0.25); z-index: 100; opacity: 0.95; }
        .piece img { width: 85%; height: 85%; object-fit: contain; pointer-events: none; }
        .piece.placed { cursor: default; pointer-events: none; }
        .hint-text { text-align: center; font-size: clamp(1rem, 3vh, 1.3rem); font-weight: 700; color: rgba(255,255,255,0.9); text-shadow: 0 2px 0 rgba(36,49,94,0.25); }
    </style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<div class="topbar">
    <a class="home-btn" href="../index.html">🏠</a>
    <div class="title">🧩 Silhouette Match</div>
    <div style="display:flex;gap:10px;">
        <button class="icon-btn" id="soundBtn">🔊</button>
        <button class="icon-btn" id="fsBtn" aria-label="Fullscreen">⛶</button>
    </div>
</div>
<main class="stage">
    <p class="hint-text">Drag the picture to its shadow</p>
    <div class="silhouette-row" id="silhouettes"></div>
    <div class="pieces-row" id="pieces"></div>
</main>
<script src="../js/common.js"></script>
<script src="../js/sound-toggle.js"></script>
<script src="../js/page-init.js"></script>
<script>
const ITEMS = [
    { name: "Dog", img: "../img/silhouettes/dog.png", sil: "../img/silhouettes/dog-silhouette.png" },
    { name: "Octopus", img: "../img/silhouettes/octopus.png", sil: "../img/silhouettes/octopus-silhouette.png" },
    { name: "Elephant", img: "../img/silhouettes/elephant.png", sil: "../img/silhouettes/elephant-silhouette.png" },
    { name: "Bird", img: "../img/silhouettes/bird.png", sil: "../img/silhouettes/bird-silhouette.png" },
    { name: "Airplane", img: "../img/silhouettes/aircraft.png", sil: "../img/silhouettes/aircraft-silhouette.png" },
    { name: "Dolphin", img: "../img/silhouettes/dolphin.png", sil: "../img/silhouettes/dolphin-silhouette.png" },
    { name: "Fish", img: "../img/silhouettes/fish.png", sil: "../img/silhouettes/fish-silhouette.png" },
    { name: "Starfish", img: "../img/silhouettes/starfish.png", sil: "../img/silhouettes/starfish-silhouette.png" },
    { name: "Seahorse", img: "../img/silhouettes/seahorse.png", sil: "../img/silhouettes/seahorse-silhouette.png" },
    { name: "Sealife", img: "../img/silhouettes/sealife.png", sil: "../img/silhouettes/sealife-silhouette.png" }
];

let currentSet = [];
let draggedPiece = null;
let matchedCount = 0;

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function newRound() {
    const silhouettesEl = document.getElementById("silhouettes");
    const piecesEl = document.getElementById("pieces");
    silhouettesEl.innerHTML = "";
    piecesEl.innerHTML = "";
    matchedCount = 0;

    currentSet = shuffle([...ITEMS]).slice(0, 3);

    currentSet.forEach((item, i) => {
        const slot = document.createElement("div");
        slot.className = "silhouette-slot";
        slot.dataset.name = item.name;
        const img = document.createElement("img");
        img.src = item.sil;
        img.alt = item.name;
        slot.appendChild(img);
        silhouettesEl.appendChild(slot);
    });

    const shuffledPieces = shuffle([...currentSet]);
    shuffledPieces.forEach((item, i) => {
        const piece = document.createElement("div");
        piece.className = "piece";
        piece.dataset.name = item.name;
        const img = document.createElement("img");
        img.src = item.img;
        img.alt = item.name;
        piece.appendChild(img);
        piece.addEventListener("pointerdown", onDragStart);
        piece.addEventListener("pointermove", onDragMove);
        piece.addEventListener("pointerup", onDragEnd);
        piece.addEventListener("pointercancel", onDragEnd);
        piecesEl.appendChild(piece);
    });
}

let dragOffset = { x: 0, y: 0 };
let startPos = { x: 0, y: 0 };

function onDragStart(e) {
    const piece = e.currentTarget;
    if (piece.classList.contains("placed")) return;
    draggedPiece = piece;
    piece.classList.add("dragging");
    piece.style.zIndex = 1000;
    const rect = piece.getBoundingClientRect();
    const clientX = e.clientX || e.touches?.[0]?.clientX;
    const clientY = e.clientY || e.touches?.[0]?.clientY;
    dragOffset.x = clientX - rect.left;
    dragOffset.y = clientY - rect.top;
    startPos.x = rect.left;
    startPos.y = rect.top;
    piece.style.position = "fixed";
    piece.style.left = (rect.left - dragOffset.x) + "px";
    piece.style.top = (rect.top - dragOffset.y) + "px";
    piece.style.width = rect.width + "px";
    piece.style.height = rect.height + "px";
    piece.style.margin = "0";
    document.body.appendChild(piece);
    TotAudio.pick();
    e.preventDefault();
}

function onDragMove(e) {
    if (!draggedPiece) return;
    e.preventDefault();
    const clientX = e.clientX || e.touches?.[0]?.clientX;
    const clientY = e.clientY || e.touches?.[0]?.clientY;
    draggedPiece.style.left = (clientX - dragOffset.x) + "px";
    draggedPiece.style.top = (clientY - dragOffset.y) + "px";
}

function onDragEnd(e) {
    if (!draggedPiece) return;
    e.preventDefault();
    const pieceName = draggedPiece.dataset.name;
    const slots = document.querySelectorAll(".silhouette-slot");
    let matched = false;

    const rect = draggedPiece.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    slots.forEach(slot => {
        if (matched) return;
        if (slot.dataset.name === pieceName && !slot.classList.contains("correct")) {
            const slotRect = slot.getBoundingClientRect();
            if (cx >= slotRect.left && cx <= slotRect.right && cy >= slotRect.top && cy <= slotRect.bottom) {
                matched = true;
                snapToSlot(draggedPiece, slot);
            }
        }
    });

    if (!matched) {
        returnToStart(draggedPiece);
    }

    draggedPiece = null;
}

function snapToSlot(piece, slot) {
    piece.classList.remove("dragging");
    piece.classList.add("placed");
    piece.style.position = "";
    piece.style.left = "";
    piece.style.top = "";
    piece.style.width = "";
    piece.style.height = "";
    piece.style.margin = "";
    slot.appendChild(piece);
    slot.classList.add("correct");
    // Replace silhouette with colored image
    const img = slot.querySelector("img");
    const item = ITEMS.find(i => i.name === piece.dataset.name);
    if (img && item) {
        img.src = item.img;
    }
    TotAudio.match();
    confetti(1500);
    checkRoundComplete();
}

function returnToStart(piece) {
    piece.classList.remove("dragging");
    piece.style.position = "";
    piece.style.left = "";
    piece.style.top = "";
    piece.style.width = "";
    piece.style.height = "";
    piece.style.margin = "";
    piece.style.transition = "transform 0.3s ease, top 0.3s ease, left 0.3s ease";
    piece.style.transform = "scale(1)";
    setTimeout(() => { piece.style.transition = ""; }, 300);
    document.getElementById("pieces").appendChild(piece);
    TotAudio.wrong();
}

function checkRoundComplete() {
    const correctSlots = document.querySelectorAll(".silhouette-slot.correct");
    if (correctSlots.length === 3) {
        setTimeout(() => {
            TotAudio.win();
            confetti(2000);
            setTimeout(newRound, 1500);
        }, 500);
    }
}

newRound();
</script>
</body>
</html>
